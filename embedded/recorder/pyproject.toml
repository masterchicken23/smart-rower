[project]
name = "smart-rower-recorder"
version = "0.1.0"
description = "Raw, time-synchronised recording of the Jetson's inputs (MQTT, camera frames, AprilTag records), and a player that feeds a recording back in."
requires-python = ">=3.11"
dependencies = [
    "pyzmq>=25.0",
    "paho-mqtt>=2.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["recorder*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:recorder.*"]

# Same lint settings as embedded/funnel/pyproject.toml.
[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "BLE", "C4", "SIM", "RET"]
ignore = [
    "E501",    # long lines are usually prose in a docstring
    "SIM108",  # ternaries are not always clearer
    "RET504",  # a named return value often is the documentation
    "UP006", "UP007", "UP045",   # typing.Optional, as the rest of the repo
    "SIM105",  # try/except/pass carries a comment saying why
    "SIM115",  # the session writer holds its files open across calls
]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true
