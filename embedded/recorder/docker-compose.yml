# The recorder, on the Jetson, beside the funnel and the detectors.
#
#   april-camN --raw frame tee 127.0.0.1:557N--┐
#   april-camN --detections :556N--------------┼--> recorder --> ./data/<UTC>/
#   mosquitto :1883 (the funnel's) ------------┘     HTTP :8010/recorder/*
#
# network_mode: host. The tees listen on loopback and the detectors use host
# networking, so they are on 127.0.0.1 only from the host's network; the
# funnel's broker publishes 1883 there too. Host networking also keeps the
# recorder's clock stamps free of any NAT hop.
#
# Every container on the Jetson shares the kernel's CLOCK_MONOTONIC, so the
# recorder's stamps are directly comparable with the funnel's `t_recv` and
# the detectors' -- which is what the recording's timing is built on.
#
# Start/stop sessions over HTTP (README). Overridable from a .env file beside
# this one; see .env.example.

services:
  recorder:
    build: .
    image: smart-rower/recorder
    container_name: rower-recorder
    # Never restart on its own: a recorder that comes back after a reboot
    # with REC_AUTOSTART on would quietly fill the disk.
    restart: "no"
    network_mode: host
    # Run as the owner of ./data, as the funnel does. run.sh fills these in.
    user: "${REC_UID:-10001}:${REC_GID:-10001}"
    # Time for a running session to drain its queue and fsync on `docker stop`.
    stop_grace_period: 30s
    environment:
      REC_DIR: /data
      REC_HTTP_PORT: "${REC_HTTP_PORT:-8010}"
      REC_CORS: "${REC_CORS:-*}"
      REC_MQTT_HOST: "${REC_MQTT_HOST:-127.0.0.1}"
      REC_MQTT_PORT: "${REC_MQTT_PORT:-1883}"
      REC_MQTT_TOPICS: "${REC_MQTT_TOPICS:-#}"
      REC_CAMERAS: "${REC_CAMERAS-cam1=tcp://127.0.0.1:5571,cam2=tcp://127.0.0.1:5572,cam3=tcp://127.0.0.1:5573,cam4=tcp://127.0.0.1:5574}"
      REC_APRILTAG_CONNECT: "${REC_APRILTAG_CONNECT-tcp://127.0.0.1:5561,tcp://127.0.0.1:5562,tcp://127.0.0.1:5563,tcp://127.0.0.1:5564}"
      REC_QUEUE_MB: "${REC_QUEUE_MB:-256}"
      REC_MIN_FREE_GB: "${REC_MIN_FREE_GB:-2}"
      REC_FSYNC_S: "${REC_FSYNC_S:-5}"
      REC_AUTOSTART: "${REC_AUTOSTART:-false}"
      REC_LOG_LEVEL: "${REC_LOG_LEVEL:-info}"
    volumes:
      # Put this on the NVMe: four cameras write ~2 MB/s (README, "Disk").
      - "${REC_DATA:-./data}:/data"
