[project]
name = "smart-rower-funnel"
version = "0.1.0"
description = "Buffers the boat's sensor streams, recomputes on a fixed grid, serves the results read-only."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "aiomqtt>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["funnel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:funnel.*"]

# ruff and mypy are already used on the Python in this repo (pose_api.py and
# pose_stream.py carry noqa and type-ignore directives) but no config was ever
# checked in. This records the settings those files were written against.
[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "BLE", "C4", "SIM", "RET"]
ignore = [
    "E501",    # long lines are usually prose in a docstring
    "SIM108",  # ternaries are not always clearer
    "RET504",  # a named return value often is the documentation
    # Annotation style follows the existing Python in this repo, which uses
    # typing.Optional (see experiments/network-video-yolo/pose_api.py) rather
    # than the X | None form.
    "UP006", "UP007", "UP045",
    # try/except/pass carries a comment explaining why the exception is safe
    # to swallow; contextlib.suppress would hide it.
    "SIM105",
    # The recorder deliberately holds one file handle open per stream across
    # calls, so a context manager is not applicable.
    "SIM115",
]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true
