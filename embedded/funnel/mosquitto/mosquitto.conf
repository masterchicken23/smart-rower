# Broker for the boat's local network.
#
# Anonymous and unauthenticated, deliberately: the sensors are ESP32s on an
# isolated network with no internet route, and credential management across a
# dozen microcontrollers buys nothing here. Do not expose 1883 beyond the
# boat's own AP.

listener 1883
protocol mqtt
allow_anonymous true

# Samples are QoS 0 and not retained, so there is nothing worth persisting
# across a restart. Retained status topics are cheap to republish: each sensor
# sends its own on connect.
persistence false

# Logs to stdout so `docker compose logs mosquitto` works.
log_dest stdout
log_type error
log_type warning
log_type notice

# A sensor publishing at 20 Hz needs no queue depth; dropping beats buffering.
max_queued_messages 100
