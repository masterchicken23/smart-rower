[project]
name = "smart-rower-april-detect"
version = "0.1.0"
description = "Per-camera AprilTag detector: imageZMQ JPEG in, undistort, detect, 6-DoF pose, ZMQ records out to the funnel."
# 3.10, not the funnel's 3.11: the CUDA image is built on L4T's Ubuntu 22.04,
# whose system Python is 3.10. The CPU image uses python:3.11-slim like the funnel.
requires-python = ">=3.10"
dependencies = [
    "pyzmq>=25",
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "pupil-apriltags>=1.0.4",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "imagezmq>=1.1", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["april_detect*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:april_detect.*"]

# Same lint settings as embedded/funnel/pyproject.toml.
[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "BLE", "C4", "SIM", "RET"]
ignore = [
    "E501",    # long lines are usually prose in a docstring
    "SIM108",  # ternaries are not always clearer
    "RET504",  # a named return value often is the documentation
    "UP006", "UP007", "UP045",   # typing.Optional, as the rest of the repo
    "SIM105",  # try/except/pass carries a comment saying why
    "N802", "N803", "N806",      # K, R, D: the maths' own names
]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
ignore_missing_imports = true
